<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            height: 100vh;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e5e5e5;
        }

        .card {
            width: 320px;
            padding: 32px;
            border-radius: 16px;
            background: #111;
            border: 1px solid #1f1f1f;
            transition: 0.3s;
        }

        .card:hover {
            border-color: #2a2a2a;
        }

        h2 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 24px;
            letter-spacing: 1px;
            color: #fafafa;
        }

        .form-group {
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #222;
            background: #0d0d0d;
            color: #e5e5e5;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
            background: #0f0f0f;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #3b82f6;
            color: white;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #2563eb;
        }

        .footer {
            margin-top: 18px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }

    </style>
</head>

<body>

<div class="card">
    <h2>Login</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            {{ form.username }}
        </div>

        <div class="form-group">
            {{ form.password }}
        </div>

        <button type="submit">Entrar</button>
    </form>

    <div class="footer">
        Sistema de OS
    </div>
</div>

</body>
</html>
