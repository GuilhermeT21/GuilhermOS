{% extends 'base.html' %}
{% block content %}

<h4 class="mb-4">Indicadores de Produção</h4>

<form method="get" class="mb-4">
    <select name="periodo"
            class="form-select"
            onchange="this.form.submit()">
        <option value="hoje" {% if periodo == "hoje" %}selected{% endif %}>Hoje</option>
        <option value="semana" {% if periodo == "semana" %}selected{% endif %}>Últimos 7 dias</option>
        <option value="mes" {% if periodo == "mes" %}selected{% endif %}>Mês Atual</option>
    </select>
</form>

<div class="row g-3">

    {% for card in cards %}
    <div class="col-6 col-md-4 col-lg-3">
        <div class="card text-white bg-{{ card.cor }} shadow-sm">
            <div class="card-body text-center">

                <div class="mb-2">
                    <i class="bi {{ card.icone }}" style="font-size: 2rem;"></i>
                </div>

                <h6>{{ card.label }}</h6>
                <h2 class="fw-bold">{{ card.total }}</h2>

            </div>
        </div>
    </div>
    {% endfor %}

</div>
<br>
<a href="{% url 'gerar_relatorio' %}?periodo={{ periodo }}"
   class="btn btn-success mb-3">
   Gerar Relatório
</a>

{% endblock %}
